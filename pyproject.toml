[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spamdet"
version = "0.1.0"
description = "Turkish spam/fraud/gambling-scam detection MVP - Stage 1: data + preprocessing"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.6",
    "requests>=2.31",
    "datasets>=2.19",
    "pyarrow>=15.0",
    "confusable-homoglyphs>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]
datafetch = [
    "kaggle>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
