[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spamdet"
version = "0.1.0"
description = "Turkish spam/fraud/gambling-scam detection MVP"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.6",
    "requests>=2.31",
    "datasets>=2.19",
    "pyarrow>=15.0",
    "confusable-homoglyphs>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "fakeredis>=2.21",
]
datafetch = [
    "kaggle>=1.6",
]
train = [
    # NOTE: on a Blackwell GPU (RTX 50-series, compute capability sm_120),
    # `pip install torch` alone resolves to a CPU-only or CUDA-build wheel
    # too old for this GPU. Install the matching CUDA wheel explicitly, e.g.:
    #   pip install torch==2.13.0+cu132 --index-url https://download.pytorch.org/whl/cu132
    # (check `nvidia-smi` for your driver's supported CUDA version and pick
    # the closest cuXXX index at https://download.pytorch.org/whl/).
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "scikit-learn>=1.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.19",
]
outbreak = [
    "redis>=5.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spamdet = ["api/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
