category: reklam
examples:
  - text: "Bu hafta magazamizda tum urunlerde yuzde 40'a varan indirim var, kacirmayin!"
    notes: "fuzzy-signal ad (no Mersis number, promotional tone only) - reklam classifier training data"
  - text: "Sana ozel 100 TL indirim kuponu tanimlandi, bugun kullan kazanc elde et."
  - text: "Yeni sezon koleksiyonumuz magazalarda! Ilk alisverisinize yuzde 20 indirim."
  - text: "Kis kampanyamiz basladi, secili urunlerde 2 al 1 ode firsati seni bekliyor."
  - text: "Uyelere ozel: bu hafta sonuna kadar tum kahvelerde yuzde 25 indirim."
  - text: "Yaz sezonu icin ozel firsat! Tatil paketlerinde erken rezervasyon indirimi basladi."
  - text: "3 ay taksitle, faizsiz odeme secenegiyle yeni telefon sahibi olma zamani."
  - text: "Sadakat puanlarinizla bu hafta hediye kazanma sansiniz var, hemen kullanin."
  - text: "Kredi kartiniza ozel: secili marketlerde yuzde 15 puan kazanma firsati."
  - text: "Yeni uye olan herkese ilk siparişte 50 TL indirim! Hemen kayit olun."
  - text: "Dogum gunune ozel! Sana ozel indirim kodun hesabina tanimlandi, kullanmadan kacirma."
  - text: "Bu ay sigorta yenilemede yuzde 30'a varan avantaj sizi bekliyor, hemen ariyoruz."
  - text: "Yaz aylarina ozel klima kampanyamiz basladi, ucretsiz kurulum firsatini kacirma."
  - text: "Sepetindeki urunler seni bekliyor, simdi tamamla ekstra yuzde 10 indirim kazan."
  - text: "Yilbasina ozel cift puan kazanma firsati! Alisverislerinde iki kati puan biriktir."
  - text: "Spor salonu uyeligi bu ay yuzde 50 indirimli, ilk hafta ucretsiz deneme firsati var."
  - text: "Yeni menumuzde secili urunlerde 1 al 1 bedava kampanyasi basladi."
  - text: "Emeklilere ozel bankacilik paketimizle yuksek faiz firsatini kacirmayin."
  - text: "Apple iPhone icin 1250 TL kuponun var. Aklinda telefonunu yenileme dusuncesi varsa, simdi tam zamani. Sinirli sure gecerli sana ozel hediyeni simdi kullan. Ret icin HBSMS yaz 3172ye ilet. Mersis:0265017991000011"
    notes: "real regulated marketing coupon (Mersis + opt-out) - confirmed by user as reklam, not spam"
  - text: "Hepsiburada'da bugune ozel yuzde 40 indirim kuponu seni bekliyor! Kodu kullan: HEPSI40. Mersis: 0123456789. STOP yazarak reklam mesajlarindan cikabilirsiniz."
    notes: "false positive found via live demo testing - misclassified spam at 97.9% before this fix. 'yuzde 40 indirim, hemen, kacirma, kupon, seni bekliyor' style ad language overlaps heavily with the gambling/bonus-scam spam seeds' vocabulary (bahisgeri.com etc. also use 'yuzde X bonus', 'hemen', 'kacirma'); reklam needs enough real-brand-coupon examples using this exact tone to counterbalance that, not just Mersis/opt-out markers alone."
  - text: "Trendyol'da secili urunlerde yuzde 50'ye varan indirim basladi! Kacirma, hemen incele."
  - text: "LC Waikiki'de bu hafta sonuna ozel yuzde 30 indirim firsati seni bekliyor!"
  - text: "Migros'ta bu hafta secili gida urunlerinde yuzde 25 indirim var, kacirma!"
  - text: "Boyner'de sezon sonu indirimi basladi! Tum urunlerde yuzde 60'a varan firsatlari kacirma."
  - text: "MediaMarkt'ta elektronik urunlerde yuzde 35 indirim kampanyasi basladi! Hemen magazaya ugra."
  - text: "Yemeksepeti'nden ilk siparisine ozel yuzde 50 indirim kuponu tanimlandi, kodu kullanmadan kacirma: YS50"
  - text: "Koton'da yeni sezon urunlerinde yuzde 40'a varan indirim basladi! Hemen magazaya gel."
  - text: "Getir'de bu hafta sepette yuzde 20 indirim firsati seni bekliyor, kacirma!"
  - text: "Defacto'da tum ayakkabilarda yuzde 30 indirim! Stoklar tukenmeden hemen incele."
  - text: "Kampanyalarimizdan haberdar olmak istemiyorsaniz STOP yazip gonderebilirsiniz. Bu hafta tum urunlerde yuzde 25 indirim!"
    notes: "opt-out phrased with the English 'STOP' keyword rather than Turkish 'RET' - the sms_spam_collection public dataset's real spam rows heavily use 'text STOP to opt out' boilerplate, so the model needs to see STOP-based opt-out in a genuine reklam context too, not just RET-based."
