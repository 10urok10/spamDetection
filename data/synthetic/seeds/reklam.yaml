category: reklam
examples:
  - text: "Bu hafta magazamizda tum urunlerde yuzde 40'a varan indirim var, kacirmayin!"
    notes: "fuzzy-signal ad (no Mersis number, promotional tone only) - reklam classifier training data"
  - text: "Sana ozel 100 TL indirim kuponu tanimlandi, bugun kullan kazanc elde et."
  - text: "Yeni sezon koleksiyonumuz magazalarda! Ilk alisverisinize yuzde 20 indirim."
  - text: "Kis kampanyamiz basladi, secili urunlerde 2 al 1 ode firsati seni bekliyor."
  - text: "Uyelere ozel: bu hafta sonuna kadar tum kahvelerde yuzde 25 indirim."
  - text: "Yaz sezonu icin ozel firsat! Tatil paketlerinde erken rezervasyon indirimi basladi."
  - text: "3 ay taksitle, faizsiz odeme secenegiyle yeni telefon sahibi olma zamani."
  - text: "Sadakat puanlarinizla bu hafta hediye kazanma sansiniz var, hemen kullanin."
  - text: "Kredi kartiniza ozel: secili marketlerde yuzde 15 puan kazanma firsati."
  - text: "Yeni uye olan herkese ilk siparişte 50 TL indirim! Hemen kayit olun."
  - text: "Dogum gunune ozel! Sana ozel indirim kodun hesabina tanimlandi, kullanmadan kacirma."
  - text: "Bu ay sigorta yenilemede yuzde 30'a varan avantaj sizi bekliyor, hemen ariyoruz."
  - text: "Yaz aylarina ozel klima kampanyamiz basladi, ucretsiz kurulum firsatini kacirma."
  - text: "Sepetindeki urunler seni bekliyor, simdi tamamla ekstra yuzde 10 indirim kazan."
  - text: "Yilbasina ozel cift puan kazanma firsati! Alisverislerinde iki kati puan biriktir."
  - text: "Spor salonu uyeligi bu ay yuzde 50 indirimli, ilk hafta ucretsiz deneme firsati var."
  - text: "Yeni menumuzde secili urunlerde 1 al 1 bedava kampanyasi basladi."
  - text: "Emeklilere ozel bankacilik paketimizle yuksek faiz firsatini kacirmayin."
  - text: "Apple iPhone icin 1250 TL kuponun var. Aklinda telefonunu yenileme dusuncesi varsa, simdi tam zamani. Sinirli sure gecerli sana ozel hediyeni simdi kullan. https://app.hb.biz/0L3Wl Ret icin HBSMS yaz 3172ye ilet. Mersis:0265017991000011"
    notes: "real regulated marketing coupon (Mersis + opt-out) from the user's phone - confirmed by user as reklam, not spam. Updated with the real tracking URL the user's second copy of this message included."
  - text: "Hepsiburada'da bugune ozel yuzde 40 indirim kuponu seni bekliyor! Kodu kullan: HEPSI40. Mersis: 0123456789. STOP yazarak reklam mesajlarindan cikabilirsiniz."
    notes: "false positive found via live demo testing - misclassified spam at 97.9% before this fix. 'yuzde 40 indirim, hemen, kacirma, kupon, seni bekliyor' style ad language overlaps heavily with the gambling/bonus-scam spam seeds' vocabulary (bahisgeri.com etc. also use 'yuzde X bonus', 'hemen', 'kacirma'); reklam needs enough real-brand-coupon examples using this exact tone to counterbalance that, not just Mersis/opt-out markers alone."
  - text: "Trendyol'da secili urunlerde yuzde 50'ye varan indirim basladi! Kacirma, hemen incele."
  - text: "LC Waikiki'de bu hafta sonuna ozel yuzde 30 indirim firsati seni bekliyor!"
  - text: "Migros'ta bu hafta secili gida urunlerinde yuzde 25 indirim var, kacirma!"
  - text: "Boyner'de sezon sonu indirimi basladi! Tum urunlerde yuzde 60'a varan firsatlari kacirma."
  - text: "MediaMarkt'ta elektronik urunlerde yuzde 35 indirim kampanyasi basladi! Hemen magazaya ugra."
  - text: "Yemeksepeti'nden ilk siparisine ozel yuzde 50 indirim kuponu tanimlandi, kodu kullanmadan kacirma: YS50"
  - text: "Koton'da yeni sezon urunlerinde yuzde 40'a varan indirim basladi! Hemen magazaya gel."
  - text: "Getir'de bu hafta sepette yuzde 20 indirim firsati seni bekliyor, kacirma!"
  - text: "Defacto'da tum ayakkabilarda yuzde 30 indirim! Stoklar tukenmeden hemen incele."
  - text: "Kampanyalarimizdan haberdar olmak istemiyorsaniz STOP yazip gonderebilirsiniz. Bu hafta tum urunlerde yuzde 25 indirim!"
    notes: "opt-out phrased with the English 'STOP' keyword rather than Turkish 'RET' - the sms_spam_collection public dataset's real spam rows heavily use 'text STOP to opt out' boilerplate, so the model needs to see STOP-based opt-out in a genuine reklam context too, not just RET-based."
  - text: "Turkcell'den sana ozel: bu ay ek 5 GB internet hediye! Hemen basvur, firsati kacirma."
  - text: "Vodafone'dan yeni tarife kampanyasi! Sinirsiz konusma ve 20 GB internet aylik 149 TL'den basliyor."
  - text: "Garanti BBVA kredi kartinizla bu hafta market alisverislerinde yuzde 10 iade kazanin."
  - text: "Is Bankasi'ndan sana ozel: yeni kredi karti basvurusunda ilk 3 ay aidatsiz firsati!"
  - text: "Bonus kart ile bu ay akaryakitta ekstra puan kazanma zamani, hemen kullan."
  - text: "Pegasus'tan sana ozel! Yurt ici ucuslarda 199 TL'den baslayan fiyatlarla bilet firsati, hemen rezervasyon yap."
  - text: "Obilet'te bu hafta otobus biletlerinde yuzde 15 indirim! Kodu kullan: OBIL15."
  - text: "Exxen'de yillik uyelikte yuzde 30 indirim firsati sadece bu hafta gecerli!"
  - text: "Spotify Premium ilk 3 ay yarim fiyatina, hemen basvur."
  - text: "Gratis'te tum parfumlerde yuzde 20 indirim basladi! Magazaya ugra, firsati kacirma."
  - text: "Watsons kart sahiplerine ozel: bu hafta 3 al 2 ode kampanyasi gecerli."
  - text: "IKEA'da yeni sezon urunlerinde yuzde 25'e varan indirim! Magazamizi ziyaret edin."
  - text: "Koctas'ta bahce urunlerinde yuzde 30 indirim basladi, kacirmayin."
  - text: "Vatan Bilgisayar'da secili dizustu bilgisayarlarda yuzde 20 indirim! Stoklar sinirli, hemen incele."
  - text: "Teknosa'da beyaz esyada 12 ay taksit firsati, hemen magazaya gel."
  - text: "Biletix'te bu hafta konser biletlerinde yuzde 15 indirim! Kodu kullan: KONSER15."
  - text: "BTK Akademi'de yeni donem kurslari yuzde 40 indirimli! Hemen kayit ol."
  - text: "Udemy'de bu hafta tum kurslarda buyuk indirim firsati, kacirma."
  - text: "Yetkili servisimizde bu ay yag degisiminde yuzde 20 indirim kampanyasi var, hemen randevu alin."
  - text: "Yeni model araclarda ozel finansman firsatlari sizi bekliyor, bayimizi ziyaret edin."
  - text: "Eczanem'den sana ozel: vitamin urunlerinde yuzde 15 indirim, hemen siparis ver."
  - text: "Fitness kulubumuze bu ay uye olanlara ilk ay hediye! Hemen basvur."
  - text: "Petshop'ta mama urunlerinde yuzde 20 indirim basladi, evcil dostunuz icin kacirmayin."
  - text: "Cicek siparislerinde bu hafta yuzde 25 indirim! Sevdiklerinize surpriz yapmak icin hemen siparis verin."
  - text: "Emlak fuarimiza davetlisiniz! Bu hafta sonu ozel kampanyali konutlari kacirmayin."
  - text: "Ilaninizi one cikarmak icin sana ozel yuzde 50 indirim kuponu tanimlandi, hemen kullan."
  - text: "Arkadasini davet et, ikiniz de 25 TL alisveris kredisi kazanin! Referans kodun: AFC482, uygulamadan hemen paylas."
    notes: "deliberate hard negative: structurally near-identical to gambling_scam.yaml's 'Arkadasini davet et, ikiniz de 300 TL bonus kazanin! Referans kodun XZ92' (referral bonus + referral code), but this is a legitimate e-commerce app referral, not a bahis-site scam. Teaches the model the differentiator is brand/product context, not the referral-bonus structure itself. NOTE: tried adding 3 more referral-bonus examples to fix this pattern's live-test miss, but that regressed 3 other known-good cases (literal Hepsiburada seed, Flixbus-style survey, a novel loyalty-points example) - net worse, reverted. One example stays as a documented known gap rather than chasing it further; see docs/model.md's whack-a-mole note."
  - text: "Tebrikler, sadakat programimizda 500 puan kazandiniz! Puanlarinizi bir sonraki alisverisinizde kullanabilirsiniz."
    notes: "deliberate hard negative: opens with 'Tebrikler...kazandiniz' just like gambling_scam.yaml's 'Tebrikler! Bahis hesabiniza 500 TL bonus tanimlandi' and 'Kazandiniz! Cekilis sonucu...', but this is a real loyalty-program point credit, not a prize-claim scam. No suspicious link, no urgency to click/call, no ID-verification demand - those are the actual scam tells, not the word 'kazandiniz' itself."
  - text: "Yeni cikan kis koleksiyonumuz magazalarimizda! Sizi de bekleriz."
    notes: "no discount/percent/urgency at all - plain brand-awareness ad, to avoid the model learning 'reklam' only means 'has a percent discount'."
  - text: "En yeni akilli telefon modelimiz simdi satista! Detaylar icin magazamiza ugrayin."
  - text: "Anneler gunune ozel hediye secenekleri magazamizda! Sevdiklerinizi mutlu edin."
  - text: "Yeni mobil uygulamamizi indir, ilk siparisinde yuzde 30 indirim kazan! App Store ve Google Play'de."
  - text: "Sayin musterimiz, yeni nesil kasko urunumuzle arac sigortanizda yuzde 20'ye varan avantaj sizi bekliyor. Detayli bilgi icin: sigortam.com.tr/kasko. Ticari elektronik ileti izniniz kapsaminda gonderilmistir. Mersis: 0987654321000011"
    notes: "long/formal regulated insurance ad with Mersis, different sector from the Apple/Hepsiburada retail examples - Mersis presence should not be retail-specific."
  - text: "Yeni sezon indirimleri basladi, kacirmadan magazamiza ugra!"
  - text: "Bu hafta sonuna ozel flas indirim! Secili urunlerde yuzde 70'e varan firsatlari kacirma."
  - text: "Degerli Musterimiz, Vodafone olarak size ozel avantajli indirimler, firsatlar ve kampanyalar ile ilgili tekliflerimizi sunmaya devam ederken, veri isleme izninize istinaden kisisel verilerinizi mevzuata uygun bicimde guvenle koruyoruz. Bu bilgilendirmenin hukuki yukumlulugumuz kapsaminda yapildigini belirtmek ister, iyi gunler dileriz."
    notes: "real message from user's phone, misclassified spam at 93.5% before this fix - confirmed by user as reklam. Formal/legal KVKK-style sentence structure (like the existing bilgilendirme.yaml Vodafone 'Uye Aydinlatma Metni guncellenmistir' example) but, unlike that one, explicitly names the reason for the notice as ongoing marketing ('avantajli indirimler, firsatlar ve kampanyalar... tekliflerimizi sunmaya devam ederken') rather than being a pure legal-document-update notice with no marketing mention. reklam.yaml had no formal/legal-toned examples at all before this - every existing example is a short, punchy, direct-offer sentence - so the model had nothing to generalize from for 'formal notice ABOUT an ongoing ad relationship' and fell back to spam. Distinguish carefully from the still-bilgilendirme Vodafone Aydinlatma Metni example: that one mentions no discounts/campaigns/offers at all, this one explicitly does - that's the actual differentiating signal, not company name or KVKK-legal tone alone."
  - text: "Sayin musterimiz, XYZ Bankasi olarak size ozel kampanyalar, kredi firsatlari ve indirim tekliflerimizi sunmaya devam ediyoruz. Bu kapsamda kisisel verileriniz KVKK mevzuatina uygun sekilde islenmekte ve korunmaktadir. Detayli bilgi icin: xyzbank.com.tr/aydinlatma"
    notes: "same formal-KVKK-notice-mentioning-ongoing-marketing pattern as the Vodafone example above, different sector (banking) - added so the model learns the pattern, not just one company's exact wording."
  - text: "Degerli sigortalimiz, size ozel avantajli sigorta kampanyalarimizi sunmaya devam ederken, kisisel verilerinizin islenmesine iliskin izniniz dogrultusunda mevzuata uygun olarak koruma altina alinmaktadir."
  - text: "Sayin uyemiz, size ozel indirim ve kampanya tekliflerimizi ulastirmaya devam ederken, kisisel verilerinizin KVKK kapsaminda islendigini ve guvenle korundugunu bilgilerinize sunariz."
  - text: "Ilk cicek siparisin ogretmenine yakisir! Semtinin cicekcilerinden verecegin ilk siparisinde 150 TL indirimi kacirma! https://getircarsi.onelink.me/Eaz7/f8727f49 Mersis:0394048265800010 SMS reddi icin: http://onay.li/PU34"
    notes: "real message from user's phone (Getir Carsi flower delivery, teacher's-day themed) - Mersis + opt-out link, confirmed reklam."
  - text: "Agustos ayinda QNB Kredi Karti, First kredi karti veya vadesiz hesabinizla vereceginiz ilk 3 yeni otomatik fatura odeme talimatina 150'ser TL, sonraki 2 talimata 275'er TL olmak uzere, toplamda 25 gun gecerli 1000 TL'ye varan ParaPuan hediye! Detay: https://qnb.mn/43095qc 08502220900 SMSRET->3639 Mersis:0388002333400576"
    notes: "real message from user's phone (QNB bank ParaPuan cashback campaign) - long/formal banking-campaign structure with tiered TL amounts, Mersis + opt-out, different phrasing style from the other bank-sector examples above."
  - text: "Kampanya: Sevgili Money'li universite ogrencileri Migros'ta ayricalikli! Migros Hemen'de ucretsiz teslimat, en sevilen kategori ve markalardan firsatlar seni bekliyor! Ayrica tek seferde 750 TL ve uzeri yapacagin ilk alisverisinde 100 Money hediye! Kampanya UniMoney'ye ilk uye olma tarihinden itibaren yalnizca bir kere kullanilabilir. UniMoney'ye ucretsiz uye olmak ve detayli bilgi almak icin tikla: https://mgrs.link/e607d Migros Tic. SMS Ret: 7447ye RET MG yaz MN:0622052951300016"
    notes: "real message from user's phone (Migros UniMoney student loyalty-program campaign) - long, multi-clause structure with a named sub-program (UniMoney), Mersis + opt-out, student-targeted tone distinct from the other retail examples."
  - text: "ARNAK'TAN IZMIT'E OZEL 2 ADET EV TUPU SADECE 1600 TL 3 TEMMUZ SON 4443727 05413154141 CIKIS icin AR54 yaz 4609 Gonder. MRS:0080001324800017"
    notes: "real message from user's phone (local LPG/gas-tank distributor ad) - terse ALL-CAPS flat-price-plus-deadline style with no percent discount and a business phone number instead of a URL, different register from every other reklam example so far (mostly retail/e-commerce/bank copy); Mersis + opt-out still present."
