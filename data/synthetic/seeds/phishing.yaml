category: spam
examples:
  - text: "Bankaniz guvenlik nedeniyle hesabinizi gecici olarak kisitladi. Dogrulamak icin: guvenlik-bankam.com/dogrula"
  - text: "Hesabinizda supheli giris tespit edildi. Erisiminizi geri kazanmak icin bilgilerinizi guncelleyin: hesap-guvenlik.net"
  - text: "Instagram hesabiniz 24 saat icinde kalici olarak silinecek. Itiraz etmek icin giris yapin: instagram-itiraz.com"
  - text: "Kargo teslimatiniz icin gumruk vergisi odenmemis. Odeme yapmak icin: kargo-odeme-tr.com/vergi"
  - text: "Sifreniz sizdirildi! Hesabinizi korumak icin hemen yeni sifre belirleyin: guvenli-giris-tr.com"
  - text: "Kredi kartinizda olagandisi harcama tespit edildi. Onaylamak/reddetmek icin tiklayin: kartguvenlik-bankasi.com"
  - text: "Bir cihazdan hesabiniza giris yapildi, siz degilseniz hemen bilgilerinizi dogrulayin: apple-id-dogrulama.com"
  - text: "E-Devlet sifreniz suresi doldu, yenilemek icin TC kimlik no ve sifrenizi girin: edevlet-yenile.info"
    notes: "impersonates government e-Devlet portal requesting national ID + password - high severity ATO pattern"
  - text: "WhatsApp hesabiniz baska bir cihazda aktiflestirildi. Degilseniz hemen linke tiklayip iptal edin: wa-guvenlik.com"
  - text: "Vergi dairesinden iade bildirimi: 1.850 TL iadeniz onaylandi, almak icin IBAN bilgilerinizi girin: gib-iade.net"
  - text: "PTT kargonuz adrese sigmadi, teslim adresini teyit edin: ptt-teslimat-onay.com"
  - text: "Trendyol hesabinizdan supheli siparis verildi, iptal etmek icin giris yapin: trendyol-siparis-iptal.com"
  - text: "Sosyal medya hesabiniz telif hakki ihlali nedeniyle askiya alinacak, itiraz formu: telif-itiraz-meta.com"
  - text: "Turkiye Is Bankasi guvenlik ekibi: hesabinizda dondurma islemi baslatildi, iptal icin: isbank-guvenlik-merkezi.com"
  - text: "Simdi dogrulama yapmazsaniz hesabiniz 24 saat icinde kapatilacaktir!"
    notes: "URL-less threat/urgency phishing - all other phishing seeds had a link, model learned link=phishing and missed this pattern entirely (misclassified as legitimate at 0.87 in live testing)"
  - text: "Uyeliginiz askiya alinacak, bugun onay vermezseniz erisiminiz kalici olarak kesilecek"
  - text: "Hesabinizda guvenlik ihlali tespit edildi, dogrulama icin lutfen bu numarayi hemen arayin: 0850 123 45 67"
    notes: "vishing (voice phishing) pattern - directs to a phone number instead of a link"
  - text: "Kimlik bilgileriniz guncel degil, 48 saat icinde guncellemezseniz hesabiniz dondurulacaktir"
  - text: "Sistemimizde hesabinizla ilgili olagandisi bir hareket tespit edildi, hemen musteri hizmetlerini arayin aksi halde islemleriniz durdurulacak"
  - text: "Guvenlik dogrulamaniz eksik, bugun tamamlamazsaniz yarin hesabiniza erisiminiz kapatilacaktir"
  - text: "GULMTAL arafindan adiniza, AP20231222167 barkodlu alici odemeli gonderi kabul edilmistir. Odeme: K.Karti Tutar: 24.251,65 TL Bilgi: https://bit.ly/487moOS"
    notes: "real message from user's phone, misclassified reklam at 66.2% before this fix (only 1.4% spam). Fake-cargo-COD-payment phishing: mimics the structure of the project's own real legitimate cargo-tracking bilgilendirme examples (HepsiJET, PTT Kargo) closely enough to fool the model, but the actual tells are an implausibly large card payment demand (real COD amounts are small; this claims 24,251 TL for a parcel) and a generic third-party link shortener (bit.ly) instead of the courier's own branded tracking domain (hpj.im, PTT's own site, etc.) - see the new shortener_marker.py preprocessing signal added alongside this batch."
  - text: "MNG Kargo adiniza AP88452167 barkodlu alici odemeli gonderi kabul etti. Odeme: Kredi Karti Tutar: 18.640,00 TL Detay: https://cutt.ly/mngkargo9"
  - text: "Aras Kargo tarafindan adiniza kabul edilen gonderinin odemesi tamamlanmamistir. Tutar: 12.375,50 TL Odeme icin: https://tinyurl.com/araskargo2"
  - text: "Yurtici Kargo alici odemeli gonderiniz teslim edilemedi, gumruk bedeli odenmemis. Tutar: 9.840,00 TL Odeme: https://bit.ly/yurtici-odeme"
  - text: "Gonderiniz depoda bekliyor, alici odemesi tamamlanmadan teslimat yapilamiyor. Tutar: 15.200,00 TL Odeme linki: https://dub.sh/kargo-odeme3"
    notes: "no courier name at all, deliberately vague sender - a second tell distinct from the implausible-amount one."
  - text: "PTT Kargo: AP34521890 barkodlu gonderiniz icin odeme bekleniyor. Kart ile odeme: 21.450,00 TL https://cutt.ly/pttodeme"
    notes: "deliberately reuses the real 'PTT Kargo' brand name that also appears in a genuine bilgilendirme.yaml delivery-confirmation example ('PTT Kargo: Gonderiniz teslim edilmistir...') - teaches the model that a familiar courier name alone doesn't guarantee legitimacy; the payment demand + implausible amount + generic shortener are the actual signal, not the brand name."
  - text: "Kargonuz gumruk deposunda bekletiliyor, alici odemeli tutar odenmeden cikis yapilamaz. Odenecek: 27.630,00 TL Detay: https://bit.ly/gumruk-cikis"
