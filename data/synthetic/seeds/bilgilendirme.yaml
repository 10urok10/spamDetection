category: bilgilendirme
examples:
  - text: "Yarin saat 15:00'te toplantimiz var, unutma."
  - text: "Aksam yemege geliyor musun, annem soruyor."
  - text: "Proje teslim tarihini uzattilar, yeni tarih cuma."
  - text: "Bugun hava cok guzel, parka gidelim mi?"
  - text: "Dogum gunun kutlu olsun, iyi ki varsin!"
  - text: "Yarinki sinav saat kacta basliyor?"
  - text: "Kitabi okudum, cok begendim, sana da oneririm."
  - text: "Kargonuz dagitima cikmistir. Takip icin: yurticikargo.com/takip/123456"
    notes: "real cargo tracking notification - must NOT be flagged just for containing a link"
  - text: "Hesabiniza 1.500,00 TL EFT girisi gerceklesmistir. Bakiye: 3.240,00 TL. Garanti BBVA"
    notes: "real bank transaction notification - must NOT be flagged for money+account keywords"
  - text: "Faturaniz hazir, tutar: 245,60 TL, son odeme tarihi 15.08.2026. Turk Telekom"
  - text: "Siparisiniz kargoya verildi, tahmini teslimat 2 gun icinde. Trendyol"
  - text: "Kredi karti ekstreniz hazirlandi, borcunuz 1.240 TL, son odeme 20.08.2026"
  - text: "Randevunuz 05.08.2026 saat 10:30 icin onaylanmistir. Acibadem Hastanesi"
  - text: "Bu ay 250 dakika, 500 SMS kullandiniz. Kalan kullanim: 750 dakika. Turkcell"
  - text: "PTT Kargo: Gonderiniz teslim edilmistir. Teslim alan: Ali Y."
  - text: "Is Bankam mobil uygulamasindan yaptiginiz 350 TL'lik islem onaylandi."
  - text: "Su faturaniz otomatik odeme talimatiniz geregi hesabinizdan tahsil edilmistir."
  - text: "Yarin kargo teslim edilecek, evde olur musun?"
  - text: "Toplanti linki: meet.google.com/abc-defg-hij saat 14:00'te baglaniyoruz."
    notes: "legit meeting link containing a shortened-looking URL - must not be flagged as suspicious"
  - text: "Sayin Abonemiz, 800112233440 no'lu sozlesme hesabiniza ait 17/08/2026 son odeme tarihli ilgili donem tuketim bedeli 128,60 TL olup, 64,77 TL'lik devlet destegi sonrasinda odenmesi gereken fatura tutari 60,00 TL'dir. Odemelerinizi anlasmali bankalar ve PTT subelerinden yapabilirsiniz. Faturanizi goruntulemek icin: earsiv-portal.com.tr/goruntule?ref=440921 AKSA DOGALGAZ"
    notes: "real utility bill (natural gas) e-invoice notification - formal tone + account number + link, must NOT be flagged as phishing/reklam just because it shares that surface pattern"
  - text: "Elektrik faturaniz hazirlandi. Bu donem tuketiminiz 145 kWh, odenecek tutar 312,40 TL, son odeme 22.08.2026. Faturanizi goruntulemek icin: e-fatura-goruntule.com.tr/xyz789"
  - text: "Su abonelik numaraniza ait bu ayki tuketim bedeliniz 89,50 TL olarak hesaplanmistir, otomatik odeme talimatiniz geregi tahsil edilecektir."
  - text: "WTS0303142395 nolu siparisiniz HepsiJETe ulasmis olup tahmini olarak 29.09.2026 tarihinde teslim edilecektir. Teslimatinizi takip etmek icin: hpj.im/gm0fzrtj"
    notes: "real cargo tracking, misclassified spam before this fix - model had too few cargo-tracking examples using this exact phrasing"
  - text: "Degerli musterimiz, Vodafone Elektronik Para ve Odeme Hizmetleri A.S. Uye Aydinlatma Metni guncellenmistir. Kisisel verilerinizin islenmesine iliskin guncel metne asagidaki baglantidan ulasabilirsiniz: vftr.co/vfpay-aydinlatma"
    notes: "real KVKK/legal disclosure notice from a telecom operator - misclassified spam before this fix, a real-world instance of a URL-less-formal-notice blind spot"
  - text: "VDAS aboneliginiz talebiniz uzerine iptal edilmistir. Odemesini yapmis oldugunuz doneme ait faydalardan ilgili tarihe kadar yararlanmaya devam edebilirsiniz."
    notes: "real subscription cancellation confirmation - misclassified spam before this fix"
  - text: "Pluxee dunyasina hos geldin! Restaurant Pass Yemek Kartin tanimlandi. Hemen Pluxee Turkiye mobil uygulamasini indir ve kullanmaya basla! bit.ly/pluxee_mobil"
    notes: "real service onboarding/welcome message confirming a benefit card assignment - misclassified spam before this fix, model had no 'hos geldin' onboarding examples at all"
  - text: "Degerli yolcumuz, ne dusundugunuzu onemsiyor, geri bildirimlerinizi alarak size daha iyi hizmet vermek icin calisiyoruz. Bizimle yaptiginiz son yolculugu degerlendirmek icin tiklayiniz! SMS almak istemiyorsaniz RET yazip 6235e SMS gonderebilirsiniz."
    notes: "real customer satisfaction survey invitation with opt-out - misclassified spam before this fix. IMPORTANT: this is a hard negative for the reklam classifier - it contains an opt-out phrase (RET yaz) just like real ads do, but it is NOT an ad (it's a survey invite). Do not let a rule trigger on opt-out phrases alone; this example is why (see otp_rule.py's docstring note)."
  - text: "Hediye Carkindan kazandiginiz 1 gun gecerli 1 GB internet paketiniz hesabiniza yuklenmistir. Gule gule kullanin!"
    notes: "real operator reward-credit confirmation (won from a promotional gift wheel, but this specific message is the genuine credit notification, not the promotion itself) - misclassified spam in two earlier rounds, still wrong until this fix"
