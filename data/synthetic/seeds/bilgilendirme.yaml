category: bilgilendirme
examples:
  - text: "Yarin saat 15:00'te toplantimiz var, unutma."
  - text: "Aksam yemege geliyor musun, annem soruyor."
  - text: "Proje teslim tarihini uzattilar, yeni tarih cuma."
  - text: "Bugun hava cok guzel, parka gidelim mi?"
  - text: "Dogum gunun kutlu olsun, iyi ki varsin!"
  - text: "Yarinki sinav saat kacta basliyor?"
  - text: "Kitabi okudum, cok begendim, sana da oneririm."
  - text: "Kargonuz dagitima cikmistir. Takip icin: yurticikargo.com/takip/123456"
    notes: "real cargo tracking notification - must NOT be flagged just for containing a link"
  - text: "Hesabiniza 1.500,00 TL EFT girisi gerceklesmistir. Bakiye: 3.240,00 TL. Garanti BBVA"
    notes: "real bank transaction notification - must NOT be flagged for money+account keywords"
  - text: "Faturaniz hazir, tutar: 245,60 TL, son odeme tarihi 15.08.2026. Turk Telekom"
  - text: "Siparisiniz kargoya verildi, tahmini teslimat 2 gun icinde. Trendyol"
  - text: "Kredi karti ekstreniz hazirlandi, borcunuz 1.240 TL, son odeme 20.08.2026"
  - text: "Randevunuz 05.08.2026 saat 10:30 icin onaylanmistir. Acibadem Hastanesi"
  - text: "Bu ay 250 dakika, 500 SMS kullandiniz. Kalan kullanim: 750 dakika. Turkcell"
  - text: "PTT Kargo: Gonderiniz teslim edilmistir. Teslim alan: Ali Y."
  - text: "Is Bankam mobil uygulamasindan yaptiginiz 350 TL'lik islem onaylandi."
  - text: "Su faturaniz otomatik odeme talimatiniz geregi hesabinizdan tahsil edilmistir."
  - text: "Yarin kargo teslim edilecek, evde olur musun?"
  - text: "Toplanti linki: meet.google.com/abc-defg-hij saat 14:00'te baglaniyoruz."
    notes: "legit meeting link containing a shortened-looking URL - must not be flagged as suspicious"
  - text: "Sayin Abonemiz, 800112233440 no'lu sozlesme hesabiniza ait 17/08/2026 son odeme tarihli ilgili donem tuketim bedeli 128,60 TL olup, 64,77 TL'lik devlet destegi sonrasinda odenmesi gereken fatura tutari 60,00 TL'dir. Odemelerinizi anlasmali bankalar ve PTT subelerinden yapabilirsiniz. Faturanizi goruntulemek icin: earsiv-portal.com.tr/goruntule?ref=440921 AKSA DOGALGAZ"
    notes: "real utility bill (natural gas) e-invoice notification - formal tone + account number + link, must NOT be flagged as phishing/reklam just because it shares that surface pattern"
  - text: "Elektrik faturaniz hazirlandi. Bu donem tuketiminiz 145 kWh, odenecek tutar 312,40 TL, son odeme 22.08.2026. Faturanizi goruntulemek icin: e-fatura-goruntule.com.tr/xyz789"
  - text: "Su abonelik numaraniza ait bu ayki tuketim bedeliniz 89,50 TL olarak hesaplanmistir, otomatik odeme talimatiniz geregi tahsil edilecektir."
  - text: "WTS0303142395 nolu siparisiniz HepsiJETe ulasmis olup tahmini olarak 29.09.2026 tarihinde teslim edilecektir. Teslimatinizi takip etmek icin: hpj.im/gm0fzrtj"
    notes: "real cargo tracking, misclassified spam before this fix - model had too few cargo-tracking examples using this exact phrasing"
  - text: "Degerli musterimiz, Vodafone Elektronik Para ve Odeme Hizmetleri A.S. Uye Aydinlatma Metni guncellenmistir. Kisisel verilerinizin islenmesine iliskin guncel metne asagidaki baglantidan ulasabilirsiniz: vftr.co/vfpay-aydinlatma"
    notes: "real KVKK/legal disclosure notice from a telecom operator - misclassified spam before this fix, a real-world instance of a URL-less-formal-notice blind spot"
  - text: "VDAS aboneliginiz talebiniz uzerine iptal edilmistir. Odemesini yapmis oldugunuz doneme ait faydalardan ilgili tarihe kadar yararlanmaya devam edebilirsiniz."
    notes: "real subscription cancellation confirmation - misclassified spam before this fix"
  - text: "Pluxee dunyasina hos geldin! Restaurant Pass Yemek Kartin tanimlandi. Hemen Pluxee Turkiye mobil uygulamasini indir ve kullanmaya basla! bit.ly/pluxee_mobil"
    notes: "real service onboarding/welcome message confirming a benefit card assignment - misclassified spam before this fix, model had no 'hos geldin' onboarding examples at all"
  - text: "Degerli yolcumuz, ne dusundugunuzu onemsiyor, geri bildirimlerinizi alarak size daha iyi hizmet vermek icin calisiyoruz. Bizimle yaptiginiz son yolculugu degerlendirmek icin tiklayiniz! SMS almak istemiyorsaniz RET yazip 6235e SMS gonderebilirsiniz."
    notes: "real customer satisfaction survey invitation with opt-out - misclassified spam before this fix. IMPORTANT: this is a hard negative for the reklam classifier - it contains an opt-out phrase (RET yaz) just like real ads do, but it is NOT an ad (it's a survey invite). Do not let a rule trigger on opt-out phrases alone; this example is why (see otp_rule.py's docstring note)."
  - text: "Hediye Carkindan kazandiginiz 1 gun gecerli 1 GB internet paketiniz hesabiniza yuklenmistir. Gule gule kullanin!"
    notes: "real operator reward-credit confirmation (won from a promotional gift wheel, but this specific message is the genuine credit notification, not the promotion itself) - misclassified spam in two earlier rounds, still wrong until this fix"
  - text: "Hesabınızdaki kampanya avantajı otomatik olarak yenilenmeyecektir. Kullanmak istiyorsanız geçerlilik tarihini kontrol ediniz."
    notes: "user-supplied test message, one of 15 that all shared the same two confusable patterns and were all misclassified reklam/spam before this fix - see the two notes below (Oruntu A / Oruntu B) that tag which pattern each one is. Written WITH real Turkish diacritics preserved (not transliterated to ASCII like most other seeds) - this whole batch specifically targets a formal/corporate register that is always written with full diacritics in practice, and testing with an ASCII-stripped version had been masking how bad this gap actually was."
  - text: "Kampanya mesajlarını almak istemiyorsanız iletişim tercihlerinizi hesabınızdan değiştirebilirsiniz."
    notes: "Oruntu A (existing-benefit/campaign-status wording, not a new promotion) - this one is literally just an opt-out settings notice, contains zero promotional content at all."
  - text: "Kampanya koşullarında değişiklik yapılmıştır. Güncel koşulları resmi internet sitemizden inceleyebilirsiniz."
    notes: "Oruntu A - the exact message that first exposed the ASCII-vs-diacritics testing gap: scored bilgilendirme in an ASCII test but reklam once real diacritics were restored."
  - text: "Önemli bilgilendirme: Yeni dönem hizmet bedelleri 1 Eylül itibarıyla uygulanacaktır."
    notes: "Oruntu A - a fee-change notice, not an ad."
  - text: "Randevunuzu iptal etmek için bu mesaja yanıt vermeyiniz; müşteri hizmetleri üzerinden işlem yapabilirsiniz."
    notes: "Oruntu B (calm/no-urgency account-process notice, no link or specific suspicious number) - this one scored spam (not just reklam) before this fix, the worst miss in the batch."
  - text: "Hesabınızın bazı özellikleri güvenlik nedeniyle geçici olarak devre dışı bırakılmıştır."
    notes: "Oruntu B - shares 'guvenlik nedeniyle...gecici' vocabulary with phishing.yaml's seeds almost verbatim, but has no link/call-to-action/urgency at all, unlike every phishing.yaml example - that absence is the actual differentiator the model needs to learn, not the vocabulary."
  - text: "Siparişinizde teslimat adresi değişikliği talep edilmiştir. Bu işlem size ait değilse destek ekibimizle iletişime geçiniz."
    notes: "Oruntu B - real e-commerce fraud-alert pattern, passive, directs to contacting support rather than a link."
  - text: "Kartınız güvenlik amacıyla geçici olarak kullanıma kapatılmıştır. Yeniden aktifleştirme seçenekleri için müşteri hizmetlerini arayınız."
    notes: "Oruntu B - directs to calling generic 'musteri hizmetleri', not a specific untrusted number (contrast with phishing.yaml's vishing example, which gives a specific number)."
  - text: "Hesabınızda kullanılmamış bir hediye bakiyesi bulunmaktadır. Son kullanım tarihini kontrol etmek için hesabınızı ziyaret ediniz."
    notes: "Oruntu A - informs about an existing balance's expiration, doesn't promote acquiring anything new."
  - text: "Hesabınızdaki puanların bir kısmının kullanım süresi yakında dolacaktır. Güncel puan bakiyenizi kontrol edebilirsiniz"
    notes: "Oruntu A - loyalty-point expiration reminder."
  - text: "Sayın müşterimiz, hesabınızın güvenliği için bazı bilgilerinizin yeniden doğrulanması gerekmektedir. İşlemi resmi uygulamamız üzerinden yapınız."
    notes: "Oruntu B - directs to the company's own official app, not an external link - the genuinely hardest case in the batch to distinguish from real phishing on wording alone."
  - text: "Önemli bilgilendirme: Hesabınızla ilişkili iletişim bilgileriniz güncellenmiştir. Değişiklik size ait değilse bizimle iletişime geçiniz."
    notes: "Oruntu B - account-change notification, passive."
  - text: "Güvenlik nedeniyle hesabınızda bazı işlemler geçici olarak sınırlandırılmıştır. Ayrıntılı bilgi için müşteri hizmetlerimize ulaşabilirsiniz."
    notes: "Oruntu B - this one had the most unstable prediction across rounds (bounced between bilgilendirme/reklam/spam depending on ASCII vs diacritics)."
  - text: "Randevunuzu hatırlatmak isteriz. 21 Ağustos saat 14:30'daki randevunuz için değişiklik yapmak isterseniz bizi arayabilirsiniz."
    notes: "confirmed by user as the clearest single miss in the batch - an appointment REMINDER (as opposed to the existing appointment-confirmation example above), ending in 'bizi arayabilirsiniz' apparently reading as a promotional call-to-action despite being completely mundane."
  - text: "Sayın müşterimiz, hesabınızla ilgili önemli bir bilgilendirme bulunmaktadır. Detaylar için 0850 000 00 00 numaralı müşteri hizmetlerimizi arayabilirsiniz."
    notes: "Oruntu B - includes a generic 0850 customer-service-prefix number (the standard Turkish shared-cost service line format used by virtually every legitimate company), not a suspicious personal number."
  - text: "Sigorta poliçenizdeki ek teminat avantajı bu dönem için geçerliliğini yitirmiştir. Yenilemek isterseniz müşteri temsilcinizle görüşebilirsiniz."
    notes: "Oruntu A, synthetic - insurance sector, added for cross-sector diversity beyond the user's real examples (mostly telecom/banking/e-commerce)."
  - text: "Hesabınıza tanımlı ücretsiz kargo hakkınız bu ay için sona ermiştir. Yeni dönem koşullarını uygulamadan inceleyebilirsiniz."
    notes: "Oruntu A, synthetic - e-commerce benefit-expiration sector variant."
  - text: "Sadakat kartınızdaki indirim hakkı kullanılmadığı için süresi dolmuştur. Yeni kampanya dönemiyle ilgili bilgiye uygulamadan ulaşabilirsiniz."
    notes: "Oruntu A, synthetic - retail loyalty-card variant."
  - text: "Güvenlik politikamız gereği bazı hesap işlemleriniz geçici süreyle onay bekletilmektedir. İşleminiz kısa süre içinde tamamlanacaktır."
    notes: "Oruntu B, synthetic - generic account-hold notice, no sector branding, no urgency, no link."
  - text: "Kart bilgilerinizin güncellenmesi gerekmektedir. İşlemi yalnızca resmi mobil uygulamamız üzerinden gerçekleştirebilirsiniz."
    notes: "Oruntu B, synthetic - deliberately close in wording to a real phishing card-update lure, but directs to the official app rather than a link, same differentiator as the real 'resmi uygulamamiz' example above."
  - text: "Hesabınızla ilgili rutin güvenlik kontrolü tamamlanmıştır, herhangi bir işlem yapmanıza gerek yoktur."
    notes: "Oruntu B, synthetic - explicitly reassuring/no-action-needed tone, the calmest possible register in this whole cluster."
