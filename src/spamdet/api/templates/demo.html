<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spamdet - Canli Test</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --good:           #0ca30c;

    --cat-legitimate:       #2a78d6;
    --cat-spam:             #eb6834;
    --cat-gambling_scam:    #1baf7a;
    --cat-phishing:         #eda100;
    --cat-financial_urgency:#e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;

      --cat-legitimate:       #3987e5;
      --cat-spam:             #d95926;
      --cat-gambling_scam:    #199e70;
      --cat-phishing:         #c98500;
      --cat-financial_urgency:#d55181;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --good:           #0ca30c;

    --cat-legitimate:       #3987e5;
    --cat-spam:             #d95926;
    --cat-gambling_scam:    #199e70;
    --cat-phishing:         #c98500;
    --cat-financial_urgency:#d55181;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 1.5rem; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }

  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    background: var(--page);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.75rem;
    font-family: inherit;
    font-size: 0.95rem;
  }
  textarea:focus { outline: 2px solid var(--cat-legitimate); outline-offset: 1px; }

  .examples { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
  .example-btn, .submit-btn {
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.4rem 0.7rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .example-btn:hover { color: var(--text-primary); }
  .submit-row { display: flex; justify-content: flex-end; margin-top: 0.9rem; }
  .submit-btn {
    background: var(--cat-legitimate);
    color: white;
    border: none;
    font-weight: 600;
    padding: 0.55rem 1.1rem;
  }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .hero { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .hero-label {
    font-size: 1.15rem;
    font-weight: 700;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    color: white;
  }
  .hero-conf { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 0.95rem; }

  .bar-row { display: grid; grid-template-columns: 150px 1fr 52px; align-items: center; gap: 0.6rem; margin-top: 0.55rem; }
  .bar-label { font-size: 0.85rem; color: var(--text-primary); }
  .bar-track { position: relative; height: 10px; background: var(--gridline); border-radius: 5px; overflow: hidden; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width 0.35s ease; }
  .bar-pct { font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--text-secondary); text-align: right; }

  .flags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
  .flag {
    font-size: 0.78rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex; align-items: center; gap: 0.35rem;
  }
  .flag.on { color: var(--text-primary); border-color: var(--cat-spam); }
  .flag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); }
  .flag.on .dot { background: var(--cat-spam); }

  .meta { margin-top: 0.9rem; font-size: 0.82rem; color: var(--text-muted); }
  .meta code { background: var(--gridline); padding: 0.1rem 0.35rem; border-radius: 4px; }

  .empty { color: var(--text-muted); font-size: 0.9rem; }
  .error { color: var(--cat-spam); font-size: 0.88rem; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <h1>spamdet - Canli Siniflandirma Testi</h1>
    <p class="subtitle">Bir mesaj yapistir, gercek zamanli olarak modelin ne dedigini gor.</p>

    <div class="card">
      <textarea id="text-input" placeholder="Ornek: Tebrikler! Bonus kazandiniz, hemen tiklayin: bit.ly/x"></textarea>
      <div class="examples">
        <button class="example-btn" data-example="Tebrikler! Bahis hesabiniza 500 TL bonus tanimlandi. Hemen cekmek icin: bit.ly/bonus500">Bahis dolandiriciligi</button>
        <button class="example-btn" data-example="Bankaniz guvenlik nedeniyle hesabinizi kisitladi. Dogrulamak icin: guvenlik-bankam.com/dogrula">Phishing</button>
        <button class="example-btn" data-example="Anne, telefonum bozuldu bu numaradan yaziyorum, acil 2000 TL gonderir misin, aksam oderim">Finansal aciliyet</button>
        <button class="example-btn" data-example="Hesabiniza 1.500,00 TL EFT girisi gerceklesmistir. Bakiye: 3.240,00 TL. Garanti BBVA">Gercek banka bildirimi</button>
        <button class="example-btn" data-example="Yarin saat 15:00'te toplantimiz var, unutma.">Sade sohbet</button>
      </div>
      <div class="submit-row">
        <button class="submit-btn" id="submit-btn">Siniflandir</button>
      </div>
    </div>

    <div class="card" id="result-card">
      <p class="empty">Henuz bir mesaj siniflandirilmadi.</p>
    </div>
  </div>
</div>

<script>
const CATEGORY_LABELS = {
  legitimate: "Mesru",
  spam: "Spam",
  gambling_scam: "Bahis Dolandiriciligi",
  phishing: "Phishing",
  financial_urgency: "Finansal Aciliyet",
};
const CATEGORY_ORDER = ["legitimate", "spam", "gambling_scam", "phishing", "financial_urgency"];

const textInput = document.getElementById("text-input");
const submitBtn = document.getElementById("submit-btn");
const resultCard = document.getElementById("result-card");

document.querySelectorAll(".example-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    textInput.value = btn.dataset.example;
    textInput.focus();
  });
});

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function render(data) {
  const pct = (x) => (x * 100).toFixed(1) + "%";
  const bars = CATEGORY_ORDER.map((cat) => {
    const p = data.probabilities[cat] ?? 0;
    return `
      <div class="bar-row">
        <div class="bar-label">${CATEGORY_LABELS[cat]}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${(p * 100).toFixed(1)}%; background:var(--cat-${cat});"></div>
        </div>
        <div class="bar-pct">${pct(p)}</div>
      </div>`;
  }).join("");

  const urls = data.urls_found.length
    ? data.urls_found.map((u) => `<code>${escapeHtml(u)}</code>`).join(" ")
    : "yok";

  resultCard.innerHTML = `
    <div class="hero">
      <span class="hero-label" style="background:var(--cat-${data.label});">${CATEGORY_LABELS[data.label] || data.label}</span>
      <span class="hero-conf">%${(data.confidence * 100).toFixed(1)} guven</span>
    </div>
    ${bars}
    <div class="flags">
      <span class="flag ${data.homoglyph_attack_detected ? "on" : ""}"><span class="dot"></span>Homoglyph saldirisi</span>
      <span class="flag ${data.needs_review ? "on" : ""}"><span class="dot"></span>Inceleme kuyruguna dustu</span>
      <span class="flag ${data.outbreak.is_outbreak_candidate ? "on" : ""}"><span class="dot"></span>Salgin (outbreak) eslesmesi</span>
    </div>
    <div class="meta">
      Temizlenmis metin: <code>${escapeHtml(data.cleaned_text)}</code><br>
      Bulunan linkler: ${urls}
      ${data.outbreak.is_outbreak_candidate ? `<br>Benzer mesaj id'leri: ${data.outbreak.similar_message_ids.map(escapeHtml).join(", ")}` : ""}
    </div>
  `;
}

async function classify() {
  const text = textInput.value.trim();
  if (!text) return;
  submitBtn.disabled = true;
  submitBtn.textContent = "Siniflandiriliyor...";
  resultCard.innerHTML = `<p class="empty">Siniflandiriliyor...</p>`;
  try {
    const resp = await fetch("/classify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    render(data);
  } catch (err) {
    resultCard.innerHTML = `<p class="error">Hata: ${escapeHtml(String(err))}</p>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Siniflandir";
  }
}

submitBtn.addEventListener("click", classify);
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) classify();
});
</script>
</body>
</html>
